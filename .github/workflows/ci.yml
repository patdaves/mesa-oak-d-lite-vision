name: ci
on: [push, pull_request]
jobs:
  core-tests:            # pure-Python logic, no ROS or camera needed
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install pytest
      - run: cd src/mesa_vision && python -m pytest -q test
  colcon-build:          # builds both packages in a ROS 2 Humble container
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3-pip ros-humble-cv-bridge
      - run: . /opt/ros/humble/setup.sh && colcon build --symlink-install
